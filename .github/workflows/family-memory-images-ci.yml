name: Family Memory Images CI

on:
  push:
    branches:
      - family-memory-v0.9.6
    paths:
      - 'deploy/family-memory/**'
      - '.github/workflows/family-memory-images-ci.yml'
      - '.github/workflows/family-memory-images-release.yml'
      - 'docs/family-memory*.md'
      - 'main/xiaozhi-server/core/family_identity/**'
      - 'main/xiaozhi-server/core/api/family_memory_handler.py'
      - 'main/xiaozhi-server/core/connection.py'
      - 'main/xiaozhi-server/core/handle/receiveAudioHandle.py'
      - 'main/xiaozhi-server/core/handle/textHandler/serverMessageHandler.py'
      - 'main/xiaozhi-server/core/providers/asr/base.py'
      - 'main/xiaozhi-server/core/providers/memory/base.py'
      - 'main/xiaozhi-server/core/providers/memory/powermem/powermem.py'
      - 'main/xiaozhi-server/core/utils/voiceprint_provider.py'
      - 'main/xiaozhi-server/core/websocket_server.py'
      - 'main/xiaozhi-server/tools/family_memory/**'
      - 'main/xiaozhi-server/tests/family_identity/**'
      - 'main/xiaozhi-server/requirements.txt'
      - 'main/xiaozhi-server/docker-compose_all.yml'
      - 'main/manager-api/src/main/java/xiaozhi/modules/familymemory/**'
      - 'main/manager-api/src/test/java/xiaozhi/modules/familymemory/**'
      - 'main/manager-api/src/main/java/xiaozhi/modules/config/service/impl/ConfigServiceImpl.java'
      - 'main/manager-api/src/main/java/xiaozhi/modules/sys/enums/ServerActionEnum.java'
      - 'main/manager-web/src/views/FamilyMemory.vue'
      - 'main/manager-web/src/views/familyMemoryModel.mjs'
      - 'main/manager-web/src/apis/module/familyMemory.js'
      - 'main/manager-web/src/apis/api.js'
      - 'main/manager-web/src/router/index.js'
      - 'main/manager-web/src/components/HeaderBar.vue'
      - 'main/manager-web/tests/familyMemory.test.mjs'
  pull_request:
    branches:
      - family-memory-v0.9.6
    paths:
      - 'deploy/family-memory/**'
      - '.github/workflows/family-memory-images-ci.yml'
      - '.github/workflows/family-memory-images-release.yml'
      - 'docs/family-memory*.md'
      - 'main/xiaozhi-server/core/family_identity/**'
      - 'main/xiaozhi-server/core/api/family_memory_handler.py'
      - 'main/xiaozhi-server/core/connection.py'
      - 'main/xiaozhi-server/core/handle/receiveAudioHandle.py'
      - 'main/xiaozhi-server/core/handle/textHandler/serverMessageHandler.py'
      - 'main/xiaozhi-server/core/providers/asr/base.py'
      - 'main/xiaozhi-server/core/providers/memory/base.py'
      - 'main/xiaozhi-server/core/providers/memory/powermem/powermem.py'
      - 'main/xiaozhi-server/core/utils/voiceprint_provider.py'
      - 'main/xiaozhi-server/core/websocket_server.py'
      - 'main/xiaozhi-server/tools/family_memory/**'
      - 'main/xiaozhi-server/tests/family_identity/**'
      - 'main/xiaozhi-server/requirements.txt'
      - 'main/xiaozhi-server/docker-compose_all.yml'
      - 'main/manager-api/src/main/java/xiaozhi/modules/familymemory/**'
      - 'main/manager-api/src/test/java/xiaozhi/modules/familymemory/**'
      - 'main/manager-api/src/main/java/xiaozhi/modules/config/service/impl/ConfigServiceImpl.java'
      - 'main/manager-api/src/main/java/xiaozhi/modules/sys/enums/ServerActionEnum.java'
      - 'main/manager-web/src/views/FamilyMemory.vue'
      - 'main/manager-web/src/views/familyMemoryModel.mjs'
      - 'main/manager-web/src/apis/module/familyMemory.js'
      - 'main/manager-web/src/apis/api.js'
      - 'main/manager-web/src/router/index.js'
      - 'main/manager-web/src/components/HeaderBar.vue'
      - 'main/manager-web/tests/familyMemory.test.mjs'

permissions:
  contents: read

concurrency:
  group: family-memory-images-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_VERSION: v0.9.6-${{ github.sha }}
  SERVER_IMAGE: ghcr.io/baggio110/xiaozhi-family-memory-server:v0.9.6-${{ github.sha }}
  WEB_IMAGE: ghcr.io/baggio110/xiaozhi-family-memory-web:v0.9.6-${{ github.sha }}

jobs:
  verify:
    name: Build and verify family memory images
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Run Python tests without starting services
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE/main/xiaozhi-server:/workspace" \
            -w /workspace \
            ghcr.io/xinnan-tech/xiaozhi-esp32-server:server-base \
            python -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee artifacts/python-tests.txt

      - name: Compile manager-api and run B8 tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE/main/manager-api:/workspace" \
            -v "${{ runner.temp }}/family-memory-m2:/root/.m2" \
            -w /workspace \
            maven:3.9.4-eclipse-temurin-21 \
            mvn -B -ntp -DskipTests=false \
            -Dtest=FamilyMemorySecurityContractTest,FamilyMemoryServiceTest \
            clean test
          cp -R main/manager-api/target/surefire-reports artifacts/manager-api-surefire

      - name: Test and build manager-web
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/main/manager-web \
            node:18 sh -ec '
              npm ci
              npm run check:i18n
              npm run test:unit
              npm run test:snapshot
              npm run build
            ' 2>&1 | tee artifacts/manager-web.txt

      - name: Clean host build products before image context
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf main/manager-api/target main/manager-web/node_modules main/manager-web/dist
          sudo find main/xiaozhi-server -type d -name __pycache__ -prune -exec rm -rf {} +
          sudo find main/xiaozhi-server -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Build server image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/family-memory/Dockerfile.server
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.SERVER_IMAGE }}
          build-args: |
            SOURCE=https://github.com/baggio110/xiaozhi-esp32-server
            REVISION=${{ github.sha }}
            VERSION=${{ env.IMAGE_VERSION }}

      - name: Build web image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/family-memory/Dockerfile.web
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.WEB_IMAGE }}
          build-args: |
            SOURCE=https://github.com/baggio110/xiaozhi-esp32-server
            REVISION=${{ github.sha }}
            VERSION=${{ env.IMAGE_VERSION }}

      - name: Verify images read-only
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ env.IMAGE_VERSION }}
        run: deploy/family-memory/verify-images.sh

      - name: Verify Compose override
        shell: bash
        env:
          FAMILY_MEMORY_SERVER_IMAGE: ${{ env.SERVER_IMAGE }}
          FAMILY_MEMORY_WEB_IMAGE: ${{ env.WEB_IMAGE }}
          COMPOSE_REPORT: ${{ github.workspace }}/artifacts/compose.json
        run: |
          set -euo pipefail
          if env -u FAMILY_MEMORY_SERVER_IMAGE -u FAMILY_MEMORY_WEB_IMAGE \
            docker compose \
              -f main/xiaozhi-server/docker-compose_all.yml \
              -f deploy/family-memory/compose.family-memory.yml \
              config >/dev/null 2>&1; then
            echo "缺少镜像变量时Compose未按预期失败" >&2
            exit 1
          fi
          deploy/family-memory/verify-compose.sh

      - name: Upload non-sensitive verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: family-memory-image-verification-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
